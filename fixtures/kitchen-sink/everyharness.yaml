# kitchen-sink: fixture plugin — comment here guards bump's comment-preservation
name: kitchen-sink
version: 0.1.0
description: Fixture plugin exercising every component type
author: { name: Prime Radiant, email: dev@prime-radiant.example }
license: MIT
repository: https://github.com/prime-radiant-inc/everyharness
keywords: [fixture]

bootstrap:
  skill: using-kitchen-sink

harnesses:
  claude-code:
    manifest:
      homepage: https://example.com/kitchen-sink
  hermes:
    servers:
      ks-demo:
        trust: untrusted
        timeout: 30
      ks-remote:
        costs: { per_call: 0.001 }
        spend_limit: 5.0
        cost_unit: USD

marketplace:
  name: kitchen-sink-market
  category: Developer Tools
  tags: [demo, fixture]

release:
  files:
    - { path: release.json, field: version }
  audit:
    exclude: []
